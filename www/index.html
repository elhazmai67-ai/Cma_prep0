function brand(){return `<div class="row brand"><div class="brand-mark app-logo"><img src="assets/cma-logo.png" alt="CMA Prep logo" width="38" height="38"></div><div><div class="brand-name">CMA Prep<span style="color:var(--green)">.</span></div><div class="brand-note">YOUR STUDY SPACE</div></div></div>`}
function levels(){return `<div class="level-switch" aria-label="CMA level"><button data-action="level" data-level="inter" class="${S.level==='inter'?'active':''}" aria-pressed="${S.level==='inter'}">CMA Inter</button><button data-action="level" data-level="final" class="${S.level==='final'?'active':''}" aria-pressed="${S.level==='final'}">CMA Final</button></div>`}
function renderShell(){document.documentElement.dataset.theme=S.theme;document.querySelector('.sidebar').innerHTML=brand()+`<div class="nav-label">WORKSPACE</div><nav class="nav-list">${nav.map(([p,i,n])=>`<button class="nav-button ${page===p?'active':''}" data-action="nav" data-page="${p}" ${page===p?'aria-current="page"':''}>${icon(i)}${n}${page===p?'<span class="nav-end">›</span>':''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="side-note">${icon('leaf')}<p>Progress, at your pace.</p><small>A little focus every day goes a long way.</small></div><button class="side-settings" data-action="settings">${icon('settings')} Workspace settings</button></div>`;
 document.querySelector('.topbar').innerHTML=`<div class="mobile-brand">${brand()}</div><div class="breadcrumb">Study workspace ${icon('chevron')} <strong>${nav.find(x=>x[0]===page)?.[2]}</strong></div><div class="topbar-right"><span class="demo-label"><i class="dot"></i> V1 · OFFLINE</span>${levels()}<button class="icon-btn" data-action="theme" aria-label="Switch to ${S.theme==='dark'?'light':'dark'} theme">${icon(S.theme==='dark'?'sun':'moon')}</button><button class="icon-btn mobile-settings" data-action="settings" aria-label="Workspace settings" style="display:${innerWidth<=720?'grid':'none'}">${icon('settings')}</button><div class="avatar" aria-label="Your workspace">ME</div></div>`;
 document.querySelector('.mobile-nav').innerHTML=nav.map(([p,i,n])=>`<button class="${page===p?'active':''}" data-action="nav" data-page="${p}" ${page===p?'aria-current="page"':''}>${icon(i)}<span>${n}</span></button>`).join('')}
function head(eyebrow,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${action||`<div class="date-label">A fresh day to make progress<span>${new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long'})}</span></div>`}</div><div class="mobile-workspace" style="display:none">${levels()}<span class="demo-label"><i class="dot"></i> V1 · OFFLINE</span></div>`}
function footer(){return `<footer class="page-footer"><div class="row">${icon('shield')} Saved on this device</div><span>Made for your next milestone.</span></footer>`}
function progress(p){return `<div class="progress" role="progressbar" aria-label="Completion" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`}
function subjectCard(s){const st=stats(s);return `<button class="subject-card ${s.color}" data-action="subject" data-id="${s.id}"><div class="subject-top"><span class="subject-icon ${s.color}">${icon(s.ic)}</span><span class="pill ${st.pct>=50?'pill-green':'pill-orange'}">${st.pct>=50?'Making progress':'Keep going'}</span></div><h3>${esc(s.name)}</h3><div class="sub-meta">${st.total} lectures · ${s.chapters.length} chapters</div>${progress(st.pct)}<div class="subject-foot"><span><strong>${st.pct}%</strong> lectures complete</span><span>${st.done}/${st.total}</span></div></button>`}
function home(){const t=totals(),d=days(L().date),avg=L().tests.length?Math.round(L().tests.reduce((a,x)=>a+x.score/x.max*100,0)/L().tests.length):0,rev=t.chapters?Math.round(t.rounds/(t.chapters*3)*100):0,pct=t.hours?Math.round(t.watched/t.hours*100):0,w=weak()[0];const queue=L().subjects.flatMap(s=>{const l=s.lectures.find(x=>!x.done);return l?[{s,l}]:[]}).slice(0,2);return head('YOUR PREPARATION, IN ONE PLACE','Keep your momentum.','Small steps today. A confident exam day.')+`<div class="home-grid"><div class="main-column"><section class="hero"><div class="hero-copy"><div class="eyebrow"><i class="dot"></i> YOUR NEXT CHAPTER STARTS HERE</div><h2>One day closer.<br><em>One topic stronger.</em></h2><button class="btn btn-light" data-action="nav" data-page="lectures">Continue studying ${icon('arrow')}</button></div><div class="hero-countdown"><div class="countdown-number">${d===null?'—':Math.max(0,d)}</div><div class="countdown-unit">${d===null?'SET EXAM DATE':d<0?'DATE PASSED':d===0?'EXAM DAY':'DAYS TO GO'}</div><button class="countdown-date" data-action="exam" aria-label="Edit exam date">${icon('calendar')}${formatDate(L().date)}</button></div></section><div class="stat-grid"><div class="stat"><div class="stat-top">Lectures done ${icon('video')}</div><div class="stat-value">${t.done}<small>/ ${t.total}</small></div><div class="stat-bottom"><b>${pct}%</b> of learning complete</div></div><div class="stat"><div class="stat-top">Revision ${icon('repeat')}</div><div class="stat-value">${rev}<small>%</small></div><div class="stat-bottom"><b>${t.rounds}</b> rounds checked off</div></div><div class="stat"><div class="stat-top">Test average ${icon('chart')}</div><div class="stat-value">${L().tests.length?avg:'—'}<small>${L().tests.length?'%':''}</small></div><div class="stat-bottom">Across <b>${L().tests.length}</b> practice tests</div></div></div><div class="section-title"><h2>Your subjects <span class="muted" style="font-size:11px;font-weight:400;margin-left:5px">${L().subjects.length}</span></h2><div class="subject-actions"><button class="text-btn" data-action="manage-subjects">Manage</button><button class="text-btn" data-action="add-subject">${icon('plus')} Add subject</button></div></div><div class="subject-grid">${L().subjects.map(subjectCard).join('')}</div>${!L().subjects.length?empty('A fresh start','Add your first subject to build your study plan.'):''}<div class="section-title"><h2>Up next</h2><button class="text-btn" data-action="nav" data-page="lectures">View lectures ${icon('arrow')}</button></div><div class="queue">${queue.length?queue.map(({s,l})=>`<div class="queue-row"><span class="subject-icon ${s.color}">${icon(s.ic)}</span><div><h3>${esc(l.title)}</h3><p>${esc(s.short)} · ${lectureDuration(l.hours)}</p></div><button class="queue-action" data-action="subject" data-id="${s.id}" aria-label="Open ${esc(l.title)}">${icon('arrow')}</button></div>`).join(''):`<div class="queue-row"><div><h3>You're all caught up.</h3><p>Add lectures or make time for a revision round.</p></div>${icon('check')}</div>`}</div></div><aside class="right-column">${timerCard()}<section class="insight-panel"><div class="row">${icon('spark')}<span class="eyebrow">YOUR NEXT SMALL WIN</span></div><h3>${w?esc(w.chapter):'Keep it fresh.'}</h3><p>${w?`Your average is ${w.percent}% here. A focused revision could make a real difference.`:'Revisit a chapter today. Every recall makes your preparation a little stronger.'}</p><button class="text-btn" data-action="weak" ${w?`data-id="${w.subject}"`:''}>Make time to revise ${icon('arrow')}</button></section><div class="quote"><p>“Great things are done by a series of small things.”</p><small>ONE CHAPTER AT A TIME</small></div></aside></div>`+footer()}
function picker(){return `<div class="subject-select"><select aria-label="Select subject" id="subject-picker">${L().subjects.map(s=>`<option value="${s.id}" ${active()?.id===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>`}
function empty(title,desc){return `<div class="empty">${icon('book')}<h3>${title}</h3><p>${desc}</p></div>`}
function noSubjects(){return empty('Your study space is ready','Add a subject to start tracking your preparation.')+`<button class="new-subject-button" data-action="add-subject">${icon('plus')} Add a subject</button>`}
function lectures(){const s=active();let html=head('ONE LESSON AT A TIME','Make room for learning.','A clear view of what you’ve done, and what comes next.');if(!s)return html+noSubjects()+footer();const st=stats(s),dd=days(s.target||L().date),pending=st.total-st.done,list=s.lectures.filter(l=>filter==='all'||(filter==='done'?l.done:!l.done));return html+`<div class="toolbar">${picker()}<div class="subject-actions"><button class="btn btn-outline danger" data-action="delete-subject" data-id="${s.id}">${icon('trash')} Delete subject</button><button class="btn btn-primary" data-action="add-lectures">${icon('plus')} Add lectures</button></div></div><div class="view-grid"><div><div class="summary-banner"><div><h2>${st.done} down. ${pending} to go.</h2><p>${st.watched.toFixed(1)} of ${st.hours.toFixed(1)} hours complete. Keep showing up.</p></div><div class="summary-number">${st.pct}<small>%</small></div></div><div class="filter-tabs" aria-label="Filter lectures">${[['all','All lectures',st.total],['pending','To do',pending],['done','Completed',st.done]].map(([f,n,c])=>`<button class="${filter===f?'active':''}" data-action="filter" data-filter="${f}" aria-pressed="${filter===f}">${n} <span style="opacity:.6;margin-left:3px">${c}</span></button>`).join('')}</div><div class="lecture-list">${list.map(l=>`<div class="lecture-row ${l.done?'completed':''}"><button class="check-button ${l.done?'checked':''}" role="checkbox" aria-checked="${l.done}" aria-label="Mark ${esc(l.title)} ${l.done?'incomplete':'complete'}" data-action="lecture" data-id="${l.id}">${icon('check')}</button><div><h3>${esc(l.title)}</h3><p>${lectureDuration(l.hours)} · ${l.done?'Completed':'Ready when you are'}</p></div><div class="end"><button class="delete-button" data-action="edit-lecture" data-id="${l.id}" aria-label="Edit ${esc(l.title)} and duration">${icon('settings')}</button>${l.done?'<span class="pill pill-green">Done</span>':''}<button class="delete-button" data-action="delete-lecture" data-id="${l.id}" aria-label="Delete ${esc(l.title)}">${icon('trash')}</button></div></div>`).join('')||empty(filter==='done'?'Your first small win awaits':filter==='pending'?'All caught up!':'Build your lecture list',filter==='done'?'Check off a completed lecture to see it here.':filter==='pending'?'Make some time for revision, or add your next lessons.':'Add lecture titles and duration to plan your days.')}</div></div><aside><section class="panel plan-card"><div class="row between" style="margin-bottom:12px"><span class="subject-icon">${icon('target')}</span><span class="pill pill-green">YOUR PACE</span></div><h2>A little, every day.</h2><p>${dd===null?'Set a finish date to see your daily study target.':dd<=0?'Your target date has arrived. Adjust it to plan the remaining work.':pending===0?'Your lectures are complete. You’ve earned a revision break.':`Spread ${pending} remaining lectures over ${dd} days.`}</p><div class="large">${dd>0?(pending/dd).toFixed(1):'—'} <span>lectures / day</span></div><p>${dd>0?((st.hours-st.watched)/dd).toFixed(1)+' study hours per day':'Set a future target to calculate your pace'}</p><div class="line"></div><label for="target-date">Finish lectures by</label><input type="date" id="target-date" value="${s.target||L().date||''}"><p style="font-size:9px;margin-top:8px">Your exam date is used until you set a subject target.</p></section><div class="tip-card"><b>Make it manageable.</b>Choose your own focus and break times in the Focus tab. Your timer keeps running when you switch tabs.</div></aside></div>`+footer()}
function revision(){const s=active();let html=head('RECALL. REPEAT. REMEMBER.','Make knowledge stick.','Three rounds of revision. A stronger grasp each time.');if(!s)return html+noSubjects()+footer();const st=stats(s);return html+`<div class="toolbar">${picker()}<button class="btn btn-primary" data-action="add-chapters">${icon('plus')} Add chapters</button></div><div class="view-grid"><div><div class="summary-banner"><div><h2>Keep it fresh.</h2><p>${st.rounds} of ${s.chapters.length*3} revision rounds complete.</p></div><div class="summary-number">${st.revision}<small>%</small></div></div><div class="revision-list">${s.chapters.map((c,i)=>`<section class="chapter-card"><div class="chapter-title"><h3><span class="muted" style="margin-right:8px;font-size:10px">${String(i+1).padStart(2,'0')}</span>${esc(c.name)}</h3><button class="delete-button" data-action="delete-chapter" data-id="${c.id}" aria-label="Delete ${esc(c.name)}">${icon('trash')}</button></div><div class="revision-rounds">${c.rounds.map((r,k)=>`<button class="round-button ${r?'done':''}" data-action="round" data-id="${c.id}" data-round="${k}" aria-pressed="${r}">${icon(r?'check':'repeat')} Round ${k+1}${r?' · Done':''}</button>`).join('')}</div><details><summary>Quick notes & formulas ${c.note?'· Saved':''}</summary><textarea data-note="${c.id}" aria-label="Notes for ${esc(c.name)}" placeholder="Key formulas, tricky points, things to remember…">${esc(c.note)}</textarea></details></section>`).join('')||empty('Start with one chapter','Add your chapter names, then track each revision round.')}</div></div><aside><section class="panel plan-card"><span class="subject-icon" style="margin-bottom:16px">${icon('repeat')}</span><h2>Your revision rhythm.</h2><p>Give each chapter three chances to stay with you.</p><div class="steps"><div class="step"><span class="step-num">01</span><p><strong>Understand</strong>Revisit the concepts and make short notes.</p></div><div class="step"><span class="step-num">02</span><p><strong>Recall</strong>Try the questions without looking at your notes.</p></div><div class="step"><span class="step-num">03</span><p><strong>Refine</strong>Focus on mistakes, formulas and exam practice.</p></div></div></section><div class="tip-card"><b>Write it in your own words.</b>Your quick notes are saved automatically on this browser.</div></aside></div>`+footer()}
function tests(){let html=head('PRACTICE WITH PURPOSE','See how far you’ve come.','Every result is a clue for what to focus on next.',`<button class="btn btn-primary" data-action="add-test">${icon('plus')} Log a test</button>`);const ts=L().tests,avg=ts.length?Math.round(ts.reduce((a,t)=>a+t.score/t.max*100,0)/ts.length):0,best=ts.length?Math.round(Math.max(...ts.map(t=>t.score/t.max*100))):0,ws=weak();return html+`<div class="test-stats"><div class="stat"><div class="stat-top">Tests logged ${icon('book')}</div><div class="stat-value">${ts.length}</div><div class="stat-bottom">Every attempt counts</div></div><div class="stat"><div class="stat-top">Average score ${icon('chart')}</div><div class="stat-value">${ts.length?avg:'—'}<small>${ts.length?'%':''}</small></div><div class="stat-bottom">Your overall practice</div></div><div class="stat"><div class="stat-top">Best score ${icon('flag')}</div><div class="stat-value">${ts.length?best:'—'}<small>${ts.length?'%':''}</small></div><div class="stat-bottom">A milestone to build on</div></div></div><div class="view-grid"><div><div class="section-title" style="margin-top:0"><h2>Your practice history</h2><span class="muted" style="font-size:10px">Latest first</span></div><div class="results-list">${[...ts].reverse().map(t=>{const s=L().subjects.find(x=>x.id===t.subject),p=Math.round(t.score/t.max*100);return `<div class="result-row"><div class="subject-icon ${s?.color||''}">${icon(s?.ic||'chart')}</div><div><h3>${esc(t.chapter||'Full mock test')}</h3><p>${esc(s?.short||'Subject')} · ${formatDate(t.date,{day:'numeric',month:'short'})}</p></div><div class="result-score ${p<50?'low':''}">${p}%<small>${t.score} / ${t.max} marks</small></div><button class="delete-button" data-action="delete-test" data-id="${t.id}" aria-label="Delete test result for ${esc(t.chapter||'full mock')}">${icon('trash')}</button></div>`}).join('')||empty('Your progress starts here','Log a mock test or chapter score to discover your strengths.')}</div></div><aside><section class="panel plan-card"><h2>Your last ${Math.min(5,ts.length)} attempts.</h2><p>Scores as a percentage of total marks.</p>${ts.length?`<div class="score-bars" aria-label="Recent test scores">${ts.slice(-5).map((t,i)=>{const p=Math.round(t.score/t.max*100);return `<div class="score-bar-wrap"><span>${p}%</span><div class="score-bar ${p<50?'low':''}" style="height:${p*.8}%" title="${esc(t.chapter||'Full mock')}: ${p}%"></div></div>`}).join('')}</div>`:'<p style="margin-top:20px">Your chart will appear after your first test.</p>'}<div class="line"></div><h2 style="font-size:12px">A little more attention</h2>${ws.length?ws.map(w=>`<div style="margin-top:14px"><div class="row between" style="font-size:10px"><span>${esc(w.chapter)}</span><b style="color:var(--orange)">${w.percent}%</b></div><button class="text-btn" data-action="weak" data-id="${w.subject}" style="font-size:9px">Revise this subject ${icon('arrow')}</button></div>`).join(''):'<p>No chapter averages below 50%. Keep practicing.</p>'}</section></aside></div>`+footer()}
function render(){renderShell();document.getElementById('main').innerHTML=({home,lectures,focus,revision,tests,plan}[page])();updateTimerUI()}
function go(p,id){page=p;if(id)selected=id;filter='all';history.replaceState(null,'','#'+p);render();window.scrollTo({top:0,behavior:'instant'})}
function showModal(title,description,body){const m=document.getElementById('modal');m.innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="delete-button" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div><p class="modal-description">${description}</p>${body}`;if(!m.open)m.showModal()}
const actions=(text='Save')=>`<div class="form-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">${text} ${icon('check')}</button></div>`;
function addSubject(){showModal('A new subject.','Make a little room for your next learning goal.',`<form id="subject-form"><div class="field"><label for="subject-name">Subject name</label><input id="subject-name" name="name" placeholder="e.g. Management Accounting" required maxlength="120" autocomplete="off"></div>${actions('Add subject')}</form>`)}
function addChapters(){if(!active())return addSubject();showModal('A chapter at a time.','Add the chapters you want to revisit. One per line.',`<form id="chapter-form"><div class="field"><label for="chapter-text">Chapter names</label><textarea id="chapter-text" name="chapters" placeholder="Standard costing&#10;Budgetary control&#10;Variance analysis" required></textarea></div>${actions('Add chapters')}</form>`)}
function examModal(){showModal('Your next milestone.','Choose your target exam date. This is your personal planning date.',`<form id="exam-form"><div class="field"><label for="exam-date">CMA ${S.level==='inter'?'Inter':'Final'} exam date</label><input id="exam-date" name="date" type="date" value="${L().date||''}" required></div>${actions('Save date')}</form>`)}
function testModal(){if(!L().subjects.length)return addSubject();showModal('Every attempt counts.','Log your result and turn practice into progress.',`<form id="test-form"><div class="field"><label for="test-subject">Subject</label><select id="test-subject" name="subject">${L().subjects.map(s=>`<option value="${s.id}" ${s.id===active()?.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label for="test-chapter">Test type / chapter</label><select id="test-chapter" name="chapter"></select></div><div class="fields"><div class="field"><label for="test-score">Marks scored</label><input id="test-score" name="score" type="number" min="0" step="0.5" placeholder="e.g. 72" required></div><div class="field"><label for="test-max">Out of</label><input id="test-max" name="max" type="number" min="0.5" step="0.5" value="100" required></div></div><div class="field"><label for="test-date">Test date</label><input id="test-date" name="date" type="date" value="${today()}" required></div>${actions('Save result')}</form>`);fillTestChapters()}
function fillTestChapters(){const id=document.getElementById('test-subject').value,s=L().subjects.find(x=>x.id===id);document.getElementById('test-chapter').innerHTML='<option value="">Full mock test</option>'+s.chapters.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}
function settings(){showModal('Make it yours.','This demo uses sample data. Your changes stay in this browser.',`<div class="settings-row"><div><strong>Exam countdown</strong><p>${formatDate(L().date)}</p></div><button class="switch" data-action="exam">Change date</button></div><div class="settings-row"><div><strong>Appearance</strong><p>${S.theme==='dark'?'Dark':'Light'} theme</p></div><button class="switch" data-action="theme-modal">${icon(S.theme==='dark'?'sun':'moon')}</button></div><div class="settings-row"><div><strong>Reset workspace</strong><p>Clear both levels and start again.</p></div><button class="switch danger" data-action="reset-demo">Reset</button></div><p class="form-help">The sample exam date and subject progress are for demonstration. Set your own dates and study plan.</p>`)}
function confirmDelete(type,id){deletePending={type,id,subject:active()?.id,level:S.level};showModal(type==='demo'?'Start fresh?':'Remove this entry?',type==='demo'?'This clears subjects, notes, results, plans and focus time for both levels. Export a backup first if needed.':'This removes the selected entry and its saved progress from this demo.',`<div class="form-actions"><button class="btn btn-outline" data-action="close-modal">Keep it</button><button class="btn btn-primary" data-action="confirm-delete">${type==='demo'?'Clear workspace':'Remove entry'}</button></div>`)}
function closeModal(){document.getElementById('modal').close()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
 if(a==='nav')go(b.dataset.page);else if(a==='level'){if(S.level!==b.dataset.level)resetTimer(true);S.level=b.dataset.level;selected=L().subjects[0]?.id||'';filter='all';save();render()}else if(a==='subject')go('lectures',id);else if(a==='weak')go('revision',id);else if(a==='theme'||a==='theme-modal'){S.theme=S.theme==='dark'?'light':'dark';save();render();if(a==='theme-modal')settings()}else if(a==='settings')settings();else if(a==='exam')examModal();else if(a==='close-modal')closeModal();else if(a==='add-subject')addSubject();else if(a==='add-lectures')addLectures();else if(a==='add-chapters')addChapters();else if(a==='add-test')testModal();else if(a==='filter'){filter=b.dataset.filter;render()}else if(a==='lecture')toggleLectureDone(id);else if(a==='round')toggleRevision(id,Number(b.dataset.round));else if(a==='delete-lecture')confirmDelete('lecture',id);else if(a==='delete-chapter')confirmDelete('chapter',id);else if(a==='delete-test')confirmDelete('test',id);else if(a==='reset-demo')confirmDelete('demo');else if(a==='confirm-delete'){const x=deletePending;if(!x)return;const l=S.levels[x.level],s=l.subjects.find(s=>s.id===x.subject);if(x.type==='lecture')s.lectures=s.lectures.filter(y=>y.id!==x.id);if(x.type==='chapter'){const c=s.chapters.find(y=>y.id===x.id);s.chapters=s.chapters.filter(y=>y.id!==x.id)}if(x.type==='test')l.tests=l.tests.filter(y=>y.id!==x.id);if(x.type==='demo'){const th=S.theme;S=seed();S.theme=th;page='home';selected=L().subjects[0].id;resetFocusData()}save();closeModal();render();toast(x.type==='demo'?'Workspace cleared. A fresh start.':'Entry removed.');deletePending=null}else if(a==='timer')toggleTimer();else if(a==='timer-reset')resetTimer()});
document.addEventListener('change',e=>{if(e.target.id==='subject-picker'){selected=e.target.value;filter='all';render()}else if(e.target.id==='target-date'){active().target=e.target.value;save();render();toast('Your daily study pace is updated.')}else if(e.target.id==='test-subject')fillTestChapters()});
document.addEventListener('input',e=>{if(e.target.dataset.note){const c=active()?.chapters.find(x=>x.id===e.target.dataset.note);if(c){c.note=e.target.value;save()}}if(e.target.id==='test-score'||e.target.id==='test-max'){const sc=document.getElementById('test-score');sc.setCustomValidity('')}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,fd=new FormData(form);let message='Saved.';
 if(form.id==='subject-form'){const n=fd.get('name').trim();if(!n)return;const colors=['green','orange','purple','blue'],idx=L().subjects.length%4,s=subject(uid(),n,n,colors[idx],['calculator','briefcase','layers','chart'][idx],[],0,0);L().subjects.push(s);selected=s.id;message='Your new subject is ready.'}
 else if(form.id==='lecture-form'){const lines=fd.get('lectures').split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length)return;const additions=[];for(const line of lines){const m=line.match(/^(.*?)[,|]\s*(-?\d+(?:\.\d+)?)\s*$/),title=(m?m[1]:line).trim(),hours=m?Number(m[2]):1;if(!title||!Number.isFinite(hours)||hours<=0||hours>100){document.getElementById('lecture-text').setCustomValidity('Use a title and a duration greater than 0 and no more than 100 hours.');document.getElementById('lecture-text').reportValidity();return}additions.push({id:uid(),title,hours,done:false})}active().lectures.push(...additions);filter='all';message=additions.length+' lecture'+(additions.length>1?'s':'')+' added to your plan.'}
 else if(form.id==='chapter-form'){const lines=fd.get('chapters').split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length)return;active().chapters.push(...lines.map(name=>({id:uid(),name,rounds:[false,false,false],note:''})));message='Your chapters are ready for revision.'}
 else if(form.id==='exam-form'){L().date=fd.get('date');message='Your countdown is updated.'}
 else if(form.id==='test-form'){const score=Number(fd.get('score')),max=Number(fd.get('max'));if(!Number.isFinite(score)||!Number.isFinite(max)||score<0||max<=0||score>max){const i=document.getElementById('test-score');i.setCustomValidity('Marks must be between 0 and the total marks.');i.reportValidity();return}L().tests.push({id:uid(),subject:fd.get('subject'),chapter:fd.get('chapter'),score,max,date:fd.get('date')});message='Test result saved. Every attempt counts.'}else return;save();closeModal();render();toast(message)});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
document.addEventListener('input',e=>{if(e.target.id==='lecture-text')e.target.setCustomValidity('')});
document.addEventListener('visibilitychange',()=>tick());let mobile=innerWidth<=720;window.addEventListener('resize',()=>{const m=innerWidth<=720;if(m!==mobile){mobile=m;renderShell()}});
</script>
